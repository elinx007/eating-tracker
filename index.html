<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Flow Tracker</title>
    <!-- Tailwind CSS for clean styling -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-indigo-600 text-white py-4 shadow-md">
        <div class="max-w-3xl mx-auto px-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">🍎 Daily Flow Tracker</h1>
            <span id="current-date" class="text-sm bg-indigo-700 px-3 py-1 rounded-full"></span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-3xl w-full mx-auto p-4 flex-grow flex flex-col gap-6">

        <!-- Natural Language Input Box -->
        <section class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
            <h2 class="text-md font-semibold mb-2 text-slate-700">What's on your mind? (Meals, drinks, exercise...)</h2>
            <form id="log-form" class="flex flex-col gap-3">
                <textarea id="log-input" rows="3" 
                    placeholder="e.g., Had a chicken wrap and iced tea for lunch. Snacked on almonds. Walked 30 mins."
                    class="w-full p-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm"></textarea>
                <div class="flex justify-between items-center">
                    <span class="text-xs text-slate-400">Tip: Just write naturally; we'll parse and log it!</span>
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-lg font-medium text-sm transition-colors cursor-pointer">
                        Log Entry
                    </button>
                </div>
            </form>
        </section>

        <!-- Summary & Tabs -->
        <section class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
            <div class="flex border-b border-slate-200 mb-4 pb-2 gap-4">
                <button onclick="switchTab('today')" id="tab-today" class="font-semibold text-indigo-600 border-b-2 border-indigo-600 pb-1 cursor-pointer">Today's Log</button>
                <button onclick="switchTab('history')" id="tab-history" class="text-slate-500 hover:text-slate-700 pb-1 cursor-pointer">History & Trends</button>
            </div>

            <!-- Today View -->
            <div id="view-today" class="space-y-4">
                <div id="entries-container" class="space-y-3">
                    <!-- Dynamic entries load here -->
                </div>
                <div id="empty-state" class="text-center py-8 text-slate-400 text-sm hidden">
                    No entries logged for today yet. Type something above to get started!
                </div>
            </div>

            <!-- History View -->
            <div id="view-history" class="space-y-3 hidden">
                <p class="text-sm text-slate-500">Past logs and weekly summaries will appear here as you build your streak.</p>
                <div id="history-container" class="space-y-2"></div>
            </div>
        </section>

    </main>

    <!-- Simple JavaScript Logic -->
    <script>
        // Set Header Date
        const options = { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' };
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('en-US', options);

        // State Management (LocalStorage)
        let entries = JSON.parse(localStorage.getItem('flow_tracker_entries')) || [];

        const form = document.getElementById('log-form');
        const input = document.getElementById('log-input');
        const container = document.getElementById('entries-container');
        const emptyState = document.getElementById('empty-state');
        const historyContainer = document.getElementById('history-container');

        // Form Submit Handler
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = input.value.trim();
            if (!text) return;

            const newEntry = {
                id: Date.now(),
                timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                dateKey: new Date().toISOString().split('T')[0],
                fullDate: new Date().toLocaleDateString(),
                text: text
            };

            entries.unshift(newEntry);
            localStorage.setItem('flow_tracker_entries', JSON.stringify(entries));
            
            input.value = '';
            renderEntries();
        });

        // Render Today's Entries
        function renderEntries() {
            const todayKey = new Date().toISOString().split('T')[0];
            const todaysEntries = entries.filter(e => e.dateKey === todayKey);

            container.innerHTML = '';
            if (todaysEntries.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                todaysEntries.forEach(entry => {
                    const div = document.createElement('div');
                    div.className = "p-3 bg-slate-50 rounded-lg border border-slate-100 flex justify-between items-start";
                    div.innerHTML = `
                        <p class="text-sm text-slate-700 whitespace-pre-wrap flex-grow">${escapeHtml(entry.text)}</p>
                        <span class="text-xs text-slate-400 ml-3 whitespace-nowrap">${entry.timestamp}</span>
                    `;
                    container.appendChild(div);
                });
            }
            renderHistory();
        }

        // Render History Tab
        function renderHistory() {
            historyContainer.innerHTML = '';
            if (entries.length === 0) {
                historyContainer.innerHTML = '<p class="text-sm text-slate-400">No history recorded yet.</p>';
                return;
            }

            // Group by date
            const grouped = entries.reduce((acc, entry) => {
                acc[entry.fullDate] = acc[entry.fullDate] || [];
                acc[entry.fullDate].push(entry);
                return acc;
            }, {});

            for (const [date, dayEntries] of Object.entries(grouped)) {
                const dayBox = document.createElement('div');
                dayBox.className = "p-3 border border-slate-200 rounded-lg bg-slate-50";
                dayBox.innerHTML = `
                    <h4 class="text-xs font-bold text-indigo-600 mb-1">${date}</h4>
                    <ul class="list-disc list-inside text-xs text-slate-600 space-y-1">
                        ${dayEntries.map(e => `<li>${escapeHtml(e.text)} <span class="text-slate-400">(${e.timestamp})</span></li>`).join('')}
                    </ul>
                `;
                historyContainer.appendChild(dayBox);
            }
        }

        // Tab Switching Logic
        function switchTab(tab) {
            const todayTab = document.getElementById('tab-today');
            const historyTab = document.getElementById('tab-history');
            const todayView = document.getElementById('view-today');
            const historyView = document.getElementById('view-history');

            if (tab === 'today') {
                todayTab.className = "font-semibold text-indigo-600 border-b-2 border-indigo-600 pb-1 cursor-pointer";
                historyTab.className = "text-slate-500 hover:text-slate-700 pb-1 cursor-pointer";
                todayView.classList.remove('hidden');
                historyView.classList.add('hidden');
            } else {
                historyTab.className = "font-semibold text-indigo-600 border-b-2 border-indigo-600 pb-1 cursor-pointer";
                todayTab.className = "text-slate-500 hover:text-slate-700 pb-1 cursor-pointer";
                historyView.classList.remove('hidden');
                todayView.classList.add('hidden');
            }
        }

        // Simple HTML Escaper for safety
        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Initial Load
        renderEntries();
    </script>
</body>
</html>
